name: publish

# Publishes one kit from the Orca kits organization on production. Runs on
# main only, in the "production" environment, whose required reviewer
# approves each run; its secret ORCA_KITS_API_KEY is a member key of Orca kits.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "The kit's folder under kits/"
        required: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python scripts/publish.py "$SLUG"
        env:
          SLUG: ${{ inputs.slug }}
          ORCA_KITS_API_KEY: ${{ secrets.ORCA_KITS_API_KEY }}
